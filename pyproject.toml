[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fragility-engine"
version = "0.2.0"
description = "Deterministic adversarial search over emergent-system simulations (fragility fuzzing)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "networkx>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
