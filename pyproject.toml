[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fragility-engine"
version = "0.4.0"
description = "Deterministic adversarial search over emergent-system simulations (fragility fuzzing)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "networkx>=3.2"]
keywords = ["simulation", "robustness", "stress-testing", "counterfactual", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/theorem6/fragility-discovery-engine"
Issues = "https://github.com/theorem6/fragility-discovery-engine/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8.0", "matplotlib>=3.8.0"]
viz = ["matplotlib>=3.8.0"]
accelerate = ["numba>=0.59"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

