[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fragility-engine"
version = "0.6.5"
description = "AgenticOps stress-search harness: deterministic GA/MC over modular simulations, BYOW adapters, replay JSON, and FEL evidence semantics."
readme = "docs/PYPI_README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "David Peterson", email = "david@agenticop.io" },
]
maintainers = [
    { name = "AgenticOps", email = "david@agenticop.io" },
]
dependencies = ["numpy>=1.26", "networkx>=3.2"]
keywords = [
    "agenticops",
    "simulation",
    "robustness",
    "stress-testing",
    "counterfactual",
    "benchmark",
    "bring-your-own-world",
    "falsification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://agenticop.io"
Documentation = "https://github.com/AgenticOp-io/fragility-discovery-engine/blob/main/docs/HOW_TO_USE.md"
Repository = "https://github.com/AgenticOp-io/fragility-discovery-engine"
Issues = "https://github.com/AgenticOp-io/fragility-discovery-engine/issues"
Changelog = "https://github.com/AgenticOp-io/fragility-discovery-engine/releases"
Demo = "https://fragility.agenticop.io/"
DOI = "https://doi.org/10.5281/zenodo.20455688"
"Translation Hub" = "https://hub.agenticop.io/"

[project.scripts]
fragility = "fragility_engine.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8.0", "matplotlib>=3.8.0"]
viz = ["matplotlib>=3.8.0"]
accelerate = ["numba>=0.59"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
