<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fragility Pareto viewer</title>
  <style>
    :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; max-width: 960px; margin-inline: auto; }
    canvas { width: 100%; height: 420px; border: 1px solid #8884; border-radius: 8px; background: #1112; }
    #meta { font-size: 13px; opacity: 0.85; white-space: pre-wrap; margin-top: 10px; }
    .btn {
      font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #8886;
      background: #2a2a30; color: #eee; cursor: pointer; margin-right: 8px;
    }
    .btn:hover { background: #3a3a44; }
    #hint { font-size: 12px; opacity: 0.8; margin-bottom: 12px; line-height: 1.45; }
    code { font-size: 11px; }
  </style>
</head>
<body>
  <strong>Pareto frontier viewer</strong>
  <div id="hint">
    Load <code>pareto_front.json</code> from <code>python scripts/export_pareto_front.py</code>.
    Axes: <strong>x = attack_cost</strong> (minimize), <strong>y = severity</strong> (maximize). Non-dominated points only (merged archive).
    Bundled sample: <code>sample_pareto_front.json</code> in this folder.
  </div>
  <div style="margin-bottom:10px">
    <button type="button" class="btn" id="btnPick">Choose pareto_front.json…</button>
    <input id="file" type="file" accept="application/json,.json" hidden />
  </div>
  <canvas id="cv" width="920" height="420" aria-label="Pareto scatter"></canvas>
  <pre id="meta">Load JSON to begin.</pre>

  <script>
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const meta = document.getElementById('meta');
    const fileInput = document.getElementById('file');
    document.getElementById('btnPick').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const f = fileInput.files?.[0];
      if (!f) return;
      f.text().then(t => {
        try {
          const data = JSON.parse(t);
          drawPareto(data);
        } catch (e) {
          meta.textContent = 'Invalid JSON: ' + e;
        }
      });
      fileInput.value = '';
    });

    function drawPareto(data) {
      const arch = data.archive;
      if (!Array.isArray(arch) || !arch.length) {
        meta.textContent = 'Expected { archive: [ { severity, attack_cost, collapsed }, … ] }';
        ctx.clearRect(0, 0, cv.width, cv.height);
        return;
      }
      const costs = arch.map(p => Number(p.attack_cost));
      const sevs = arch.map(p => Number(p.severity));
      const minC = Math.min(...costs);
      const maxC = Math.max(...costs);
      const minS = Math.min(...sevs);
      const maxS = Math.max(...sevs);
      const pad = 48;
      const W = cv.width;
      const H = cv.height;
      const pw = W - 2 * pad;
      const ph = H - 2 * pad;
      const spanC = maxC - minC || 1;
      const spanS = maxS - minS || 1;
      function xc(c) {
        return pad + ((c - minC) / spanC) * pw;
      }
      function yc(s) {
        return pad + (1 - (s - minS) / spanS) * ph;
      }

      ctx.fillStyle = '#1118';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#555';
      ctx.strokeRect(pad, pad, pw, ph);

      ctx.fillStyle = '#ccc';
      ctx.font = '12px system-ui';
      ctx.fillText('attack_cost →', W / 2 - 36, H - 12);
      ctx.save();
      ctx.translate(14, H / 2 + 36);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText('severity →', 0, 0);
      ctx.restore();

      arch.forEach((p, i) => {
        const x = xc(Number(p.attack_cost));
        const y = yc(Number(p.severity));
        ctx.fillStyle = p.collapsed ? '#f84' : '#8af';
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#888';
        ctx.font = '10px system-ui';
        ctx.fillText(String(i), x + 7, y + 3);
      });

      meta.textContent =
        `schema: ${data.schema ?? '?'}\n` +
        `best_fitness: ${data.best_fitness ?? '—'}\n` +
        `archive points: ${arch.length}\n` +
        `cost [${minC.toFixed(4)}, ${maxC.toFixed(4)}]\n` +
        `severity [${minS.toFixed(4)}, ${maxS.toFixed(4)}]`;
    }

    fetch('sample_pareto_front.json')
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        if (d) drawPareto(d);
      })
      .catch(() => {});
  </script>
</body>
</html>
