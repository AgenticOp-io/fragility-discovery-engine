name: Bug report
description: Report incorrect behavior — include how to reproduce and attach or paste minimal JSON when you can.
body:
  - type: markdown
    attributes:
      value: |
        Reproducible reports are fastest with a **short command line**, **seeds**, and a **small JSON** (replay, Pareto, or counterfactual) attached or pasted.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened vs what you expected?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands run, relevant flags (`--seed`, `--genome-seed`, bundle id), and attach or paste a **minimal** artifact.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: e.g. `0.4.0` or `git rev-parse HEAD` output
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: false
