name: Bug report
description: Something broke or results look wrong — include seeds and artifacts when possible.
body:
  - type: markdown
    attributes:
      value: |
        **Tip:** reproducible bugs close fastest when we have a **minimal JSON** (replay, Pareto, or counterfactual) plus **exact CLI** and **OS / Python version**.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened vs what you expected?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands run, relevant flags (`--seed`, `--genome-seed`, bundle id), and attach or paste a **minimal** artifact.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: e.g. `0.4.0` or `git rev-parse HEAD` output
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: false
