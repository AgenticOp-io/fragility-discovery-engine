name: GitHub Pages

# Deploy Pages manually: powershell -File scripts/deploy_github_pages.ps1
# (push to gh-pages branch). This workflow is disabled to avoid racing local deploys.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build branded public site
        run: python scripts/build_public_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/public_site
      - id: deployment
        uses: actions/deploy-pages@v4
