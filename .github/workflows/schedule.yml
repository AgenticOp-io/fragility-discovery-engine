# Weekly regression on main (Ubuntu + Python 3.12) — complements push/PR CI matrix.
# Uploads benchmark-manifest-v2 JSON (artifact retention: 90 days).

name: Scheduled regression

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Full pytest (same perf gate as default CI)
        env:
          FRAGILITY_PERF_GATE: "1"
          FRAGILITY_PERF_GATE_MS: "240000"
        run: python -m pytest -q

      - name: Write benchmark manifest (artifact)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fragility_engine.benchmarks.manifest import build_benchmark_manifest
          Path("benchmark_manifest.json").write_text(
              json.dumps(build_benchmark_manifest(), indent=2), encoding="utf-8"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-manifest-${{ github.run_id }}
          path: benchmark_manifest.json
          retention-days: 90
