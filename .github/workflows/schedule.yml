# Weekly regression on main (Ubuntu + Python 3.12) — complements push/PR CI matrix.
# Artifacts are not uploaded; failures surface in the Actions tab.

name: Scheduled regression

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Full pytest (same perf gate as default CI)
        env:
          FRAGILITY_PERF_GATE: "1"
          FRAGILITY_PERF_GATE_MS: "240000"
        run: python -m pytest -q
