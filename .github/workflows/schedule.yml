# Weekly regression on main (Ubuntu + Python 3.12) — complements push/PR CI matrix.
# Uploads benchmark-manifest-v2 JSON (artifact retention: 90 days).

name: Scheduled regression

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: schedule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Full pytest (same perf gate as default CI)
        env:
          FRAGILITY_PERF_GATE: "1"
          FRAGILITY_PERF_GATE_MS: "240000"
        run: python -m pytest -q

      - name: Benchmark validate + manifest artifact
        run: |
          python scripts/run_benchmark_suite.py --validate --manifest-out benchmark_manifest.json --manifest-summary
          python scripts/check_manifest_digest.py
          python scripts/check_manifest_inventory.py
          python scripts/check_flagship_bundled.py

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-manifest-${{ github.run_id }}
          path: benchmark_manifest.json
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: flagship-bundled-${{ github.run_id }}
          path: |
            artifacts/flagship/bundled/fragility_certificate.json
            artifacts/flagship/bundled/pareto_front.json
            artifacts/flagship/bundled/best_replay.json
          retention-days: 90

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke install wheel (POSIX glob)
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import fragility_engine; print('import_ok', fragility_engine.__file__)"
