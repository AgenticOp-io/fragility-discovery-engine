# Validation runs on Windows (ci_local.ps1) or GCE (gce_pull_and_test.sh).
# Also runs on push/PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Run tests (includes perf gate — see FRAGILITY_PERF_GATE_MS)
        env:
          FRAGILITY_PERF_GATE: "1"
          FRAGILITY_PERF_GATE_MS: "240000"
        run: python -m pytest -q

      - name: Benchmark validate + manifest artifact
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          python scripts/run_benchmark_suite.py --validate --manifest-out benchmark_manifest.json --manifest-summary
          python scripts/check_manifest_digest.py
          python scripts/check_manifest_inventory.py
          python scripts/check_flagship_bundled.py
          python scripts/check_manifest_summary.py
          python scripts/validate_viewer_presets.py
          python scripts/check_bundled_artifacts.py
          python scripts/check_bundled_pareto_hypervolume.py
          python scripts/validate_coupled_fork_bundle.py
          python scripts/check_coupled_fork_llm_bundles.py
          python scripts/check_coupled_fork_pareto.py

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        with:
          name: benchmark-manifest-ci-${{ github.sha }}
          path: benchmark_manifest.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        with:
          name: flagship-bundled-ci-${{ github.sha }}
          path: |
            artifacts/flagship/bundled/fragility_certificate.json
            artifacts/flagship/bundled/pareto_front.json
            artifacts/flagship/bundled/best_replay.json
          retention-days: 30

  # Prove release artifacts install on both Linux and Windows (pure-Python wheel + platform deps).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke install wheel (POSIX glob)
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import fragility_engine; print('import_ok', fragility_engine.__file__)"

  pypi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyPI build + twine check (no upload)
        run: python scripts/check_pypi_ready.py

  coupled-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install main engine + coupled fork
        run: |
          pip install -e ".[dev]"
          pip install -e forks/coupled_institution

      - name: Coupled fork tests
        working-directory: forks/coupled_institution
        run: python -m pytest -q

      - name: Coupled fork Pareto search pins (main tree)
        run: |
          pip install -q -e forks/coupled_institution
          python scripts/check_coupled_fork_pareto.py

  # Numba wheels are platform-specific; exercise JIT parity on Linux and Windows x86_64 runners.
  numba-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev + accelerate (Numba)
        run: pip install -e ".[dev,accelerate]"

      - name: Resource cascade Numba vs NumPy parity
        run: python -m pytest -q tests/test_resource_cascade_numba_parity.py
