name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Run tests (includes perf gate — see FRAGILITY_PERF_GATE_MS)
        env:
          FRAGILITY_PERF_GATE: "1"
          FRAGILITY_PERF_GATE_MS: "240000"
        run: python -m pytest -q

  # Numba wheels are platform-specific; Ubuntu x86_64 has stable PyPI binaries. Keeps the optional
  # resource-cascade JIT path parity-tested without slowing every matrix cell.
  numba-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev + accelerate (Numba)
        run: pip install -e ".[dev,accelerate]"

      - name: Resource cascade Numba vs NumPy parity
        run: python -m pytest -q tests/test_resource_cascade_numba_parity.py
