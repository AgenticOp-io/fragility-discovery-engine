name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Run tests (includes perf gate — see FRAGILITY_PERF_GATE_MS)
        env:
          FRAGILITY_PERF_GATE: "1"
          FRAGILITY_PERF_GATE_MS: "240000"
        run: python -m pytest -q

      - name: Write benchmark manifest (artifact)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fragility_engine.benchmarks.manifest import build_benchmark_manifest
          Path("benchmark_manifest.json").write_text(
              json.dumps(build_benchmark_manifest(), indent=2), encoding="utf-8"
          )
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        with:
          name: benchmark-manifest-ci-${{ github.sha }}
          path: benchmark_manifest.json
          retention-days: 30

  # Prove release artifacts install on both Linux and Windows (pure-Python wheel + platform deps).
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build frontend
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Smoke install wheel (POSIX glob)
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import fragility_engine; print('import_ok', fragility_engine.__file__)"

  # Numba wheels are platform-specific; exercise JIT parity on Linux and Windows x86_64 runners.
  numba-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev + accelerate (Numba)
        run: pip install -e ".[dev,accelerate]"

      - name: Resource cascade Numba vs NumPy parity
        run: python -m pytest -q tests/test_resource_cascade_numba_parity.py
