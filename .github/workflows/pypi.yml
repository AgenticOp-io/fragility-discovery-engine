# Manual PyPI publish (Phase O). Requires PYPI_API_TOKEN repository secret.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload dist/ to PyPI'
        required: true

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build twine
          python -m build
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
