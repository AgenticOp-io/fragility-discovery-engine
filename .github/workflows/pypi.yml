# Publish to PyPI via Trusted Publishing (OIDC) — no long-lived API token.
# One-time PyPI setup (while logged in): https://pypi.org/manage/account/publishing/
# Pending publisher fields:
#   PyPI Project Name: fragility-engine
#   Owner: AgenticOp-io
#   Repository name: fragility-discovery-engine
#   Workflow name: pypi.yml
#   Environment name: (leave blank)
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload dist/ to PyPI'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify (twine check)
        run: python scripts/check_pypi_ready.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
